name: Android release

# Builds the signed release APK and attaches it to a GitHub Release, on a tag of
# the form android-v<versionName>. That tag is the whole release process: it is
# what Obtainium and IzzyOnDroid watch, and what F-Droid's update check reads.
#
# Signing needs three repository secrets — ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_PASSWORD — plus KEY_ALIAS (a variable or secret). The job refuses to run
# without them: an unsigned or differently-signed APK cannot be installed over the
# previous one, so shipping it would strand every existing install.
on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: The tag must name the app's own version
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag says $tag but app/build.gradle.kts says versionName $ver — bump one to match"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — add the signing secrets before releasing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'vivatlas' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew   # a checkout on a filesystem without the bit must still work
          ./gradlew --no-daemon assembleRelease

      - name: Name the APK by version and record its checksum
        id: apk
        run: |
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          out="vivatlas-android-$ver.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Android app ${{ steps.apk.outputs.version }}
          files: |
            android/${{ steps.apk.outputs.file }}
            android/${{ steps.apk.outputs.file }}.sha256
          generate_release_notes: true

      - name: Keep the APK as a workflow artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/android-v')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: android/${{ steps.apk.outputs.file }}
