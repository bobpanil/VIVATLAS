# The public demo (src/vivatlas/demo.py) as it runs on the demo VM. See README.md
# next to this file. update.sh keeps it on the newest release by itself.
name: vivatlas-demo

services:
  vivatlas:
    # update.sh sets IMAGE only to roll back; normally this is the newest release.
    image: ${IMAGE:-ghcr.io/bobpanil/vivatlas:stable}
    restart: unless-stopped
    environment:
      DATABASE_URL: "sqlite:////data/vivatlas.db"
      DEMO_MODE: "true"
      # The fixed account in the Mozilla reviewer notes.
      DEMO_REVIEWER_EMAIL: "demo"
      DEMO_REVIEWER_PASSWORD: "demo"
      # Only cloudflared reaches this container (no port is published), so its
      # X-Forwarded-* headers can be believed.
      TRUSTED_PROXIES: "*"
      # The visitor's address as Cloudflare saw it. X-Forwarded-For can be faked
      # through Cloudflare, and the "Try it" limit counts per address.
      CLIENT_IP_HEADER: "cf-connecting-ip"
      # No AI keys and no PUBLIC_URL on purpose: AI is off, MCP stays closed.
    volumes:
      - data:/data
      - ./links.txt:/seed/links.txt:ro
    # Public resolvers, never the home network's.
    dns: [1.1.1.1, 9.9.9.9]
    mem_limit: 640m

  # Dials out to Cloudflare and brings the visitors in: no port is open on this
  # machine or the router. The tunnel's public hostname points at
  # http://vivatlas:8710. Pinned; bump it by hand now and then.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env next to this file}"
    dns: [1.1.1.1, 9.9.9.9]
    depends_on:
      - vivatlas

volumes:
  data:
